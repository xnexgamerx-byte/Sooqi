<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>لوحة الإشراف — سوقنا</title>
    <link rel="stylesheet" href="/admin/app.css" />
  </head>
  <body>
    <!-- شاشة الدخول -->
    <section id="gate" class="gate" hidden>
      <div class="gate-card">
        <h1 class="brand">سوقنا</h1>
        <p class="gate-sub">لوحة الإشراف</p>

        <div id="step-phone">
          <label class="label" for="phone">رقم الهاتف</label>
          <input
            id="phone"
            class="field"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="٠٧٧٠١٢٣٤٥٦٧"
          />
          <button id="send-code" class="btn btn-primary btn-block">
            أرسل رمز التحقق
          </button>
        </div>

        <div id="step-code" hidden>
          <label class="label" for="code">الرمز المرسل</label>
          <input
            id="code"
            class="field field-code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="——————"
          />
          <button id="verify-code" class="btn btn-primary btn-block">
            ادخل
          </button>
          <button id="back-to-phone" class="btn btn-link btn-block">
            غيّر الرقم
          </button>
        </div>

        <p id="gate-error" class="gate-error" hidden></p>
        <p class="gate-note">
          الدخول للمشرفين فقط. الحساب العادي يُرفض حتى لو صحّ الرمز.
        </p>
      </div>
    </section>

    <!-- اللوحة -->
    <div id="panel" hidden>
      <header class="topbar">
        <div class="topbar-right">
          <span class="brand-sm">سوقنا</span>
          <span class="topbar-label">لوحة الإشراف</span>
        </div>
        <div class="topbar-left">
          <span id="who" class="who"></span>
          <button id="signout" class="btn btn-ghost btn-sm">خروج</button>
        </div>
      </header>

      <div id="stats" class="stats"></div>

      <nav class="tabs" role="tablist">
        <button class="tab is-on" data-tab="queue" role="tab">
          طابور المراجعة <span id="tab-queue-count" class="pill"></span>
        </button>
        <button class="tab" data-tab="reports" role="tab">
          البلاغات <span id="tab-reports-count" class="pill"></span>
        </button>
        <button class="tab" data-tab="users" role="tab">المستخدمون</button>
      </nav>

      <main class="page">
        <section id="view-queue" class="view"></section>
        <section id="view-reports" class="view" hidden></section>
        <section id="view-users" class="view" hidden>
          <div class="search-row">
            <input
              id="user-q"
              class="field"
              type="search"
              placeholder="ابحث باسم أو رقم هاتف أو رقم حساب"
            />
            <button id="user-search" class="btn btn-primary">ابحث</button>
          </div>
          <div id="user-results"></div>
        </section>
      </main>
    </div>

    <!-- نافذة الرفض -->
    <div id="modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true">
        <h2 id="modal-title" class="modal-title"></h2>
        <p id="modal-sub" class="modal-sub"></p>
        <div id="modal-presets" class="presets"></div>
        <label class="label" for="modal-reason">السبب كما يصل صاحبه</label>
        <textarea
          id="modal-reason"
          class="field field-area"
          maxlength="300"
          rows="3"
        ></textarea>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-ghost">إلغاء</button>
          <button id="modal-confirm" class="btn btn-danger">تأكيد</button>
        </div>
      </div>
    </div>

    <!-- معاينة صورة -->
    <div id="lightbox" class="lightbox" hidden>
      <img id="lightbox-img" alt="صورة الإعلان بحجم أكبر" />
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/admin/app.js"></script>
  </body>
</html>
